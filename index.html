
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali, Baby ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(ellipse at bottom, #17264a, #080d20 70%);
    font-family: Georgia, serif;
    color: white;
}

/* Night sky */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff2bc;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffd36b;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; }
    to { opacity: 1; }
}

/* Floating Diwali elements */
.floating {
    position: absolute;
    font-size: 27px;
    animation: float 7s ease-in-out infinite;
    opacity: .75;
    pointer-events: none;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-35px) rotate(8deg); }
}

/* Main screen */
.content {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.intro {
    transition: opacity 1s, transform 1s;
}

.intro h1 {
    font-size: clamp(25px, 6vw, 43px);
    color: #f5d58c;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

.intro p {
    color: #c8cce0;
    font-size: 16px;
    margin-bottom: 35px;
}

/* Button */
button {
    padding: 17px 35px;
    border: 1px solid #e7bd69;
    border-radius: 50px;
    background: linear-gradient(135deg, #d9a94e, #8e541c);
    color: #fff;
    font-size: 16px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 25px #d9a94e55;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% { box-shadow: 0 0 40px #ffcf65aa; }
}

/* Rocket */
.rocket {
    position: fixed;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    z-index: 10;
    display: none;
}

.rocket.launch {
    display: block;
    animation: launch 2.5s ease-in forwards;
}

@keyframes launch {
    0% { bottom: -100px; transform: translateX(-50%) rotate(-45deg); }
    80% { bottom: 72vh; transform: translateX(-50%) rotate(-45deg); }
    100% { bottom: 76vh; transform: translateX(-50%) rotate(-45deg); opacity: 0; }
}

/* Message reveal */
.message {
    opacity: 0;
    transform: translateY(35px) scale(.9);
    transition: all 2s ease;
    max-width: 650px;
}

.message.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.message h1 {
    font-size: clamp(36px, 8vw, 65px);
    color: #f7d58c;
    text-shadow: 0 0 20px #ffc75b, 0 0 50px #c78b31;
    margin-bottom: 30px;
}

.message p {
    font-size: clamp(17px, 4vw, 25px);
    line-height: 1.7;
    color: #fff0ce;
    text-shadow: 0 0 15px #eab85b;
}

.heart {
    font-size: 38px;
    margin-top: 25px;
    animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.3); }
}

/* Fireworks canvas */
canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
}
</style>
</head>

<body>

<div class="sky" id="sky"></div>
<canvas id="fireworks"></canvas>

<div class="content">

    <div class="intro" id="intro">
        <h1>A Little Diwali Magic ✨</h1>
        <p>Someone special is waiting for a surprise...</p>
        <button onclick="startCelebration()">
            Tap to Celebrate ❤️
        </button>
    </div>

    <div class="message" id="message">
        <h1>Happy Diwali, Baby ❤️</h1>

        <p>
            Among a million lights,<br>
            you're the one who makes<br>
            my world shine.
        </p>

        <div class="heart">❤️</div>
    </div>

</div>

<div class="rocket" id="rocket">🚀</div>

<script>

// Create stars
const sky = document.getElementById("sky");

for (let i = 0; i < 100; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    sky.appendChild(star);
}

// Floating Diwali elements
const elements = ["🪔", "✨", "🌟", "❤️", "🏮"];

for (let i = 0; i < 16; i++) {
    const item = document.createElement("div");
    item.className = "floating";
    item.textContent = elements[i % elements.length];
    item.style.left = Math.random() * 95 + "%";
    item.style.top = Math.random() * 90 + "%";
    item.style.animationDelay = Math.random() * 5 + "s";
    item.style.animationDuration = (5 + Math.random() * 5) + "s";
    sky.appendChild(item);
}

// Fireworks engine
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function explode(x, y) {
    const colors = ["#ffd166", "#ff8c42", "#fff1b0",
                    "#ff5c8a", "#ffffff", "#f4c2ff"];

    for (let i = 0; i < 100; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 100,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 2.5 + 1
        });
    }
}

function animate() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.025;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(index, 1);
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}

animate();

// Rocket launch and celebration
let celebrationStarted = false;

function startCelebration() {

    if (celebrationStarted) return;
    celebrationStarted = true;

    document.getElementById("intro").style.opacity = "0";
    document.getElementById("intro").style.transform = "scale(.7)";

    const rocket = document.getElementById("rocket");
    rocket.classList.add("launch");

    // Rocket explosion
    setTimeout(() => {
        rocket.style.display = "none";

        explode(innerWidth / 2, innerHeight * .23);
        explode(innerWidth / 2 - 100, innerHeight * .30);
        explode(innerWidth / 2 + 100, innerHeight * .30);

        // Reveal message
        setTimeout(() => {
            document.getElementById("intro").style.display = "none";
            document.getElementById("message").classList.add("show");
        }, 900);

    }, 2200);

    // Continuous fireworks
    let count = 0;

    const fireworksInterval = setInterval(() => {
        explode(
            Math.random() * innerWidth,
            Math.random() * innerHeight * .55
        );

        count++;

        if (count >= 15) {
            clearInterval(fireworksInterval);
        }
    }, 650);
}

</script>

</body>
</html>
